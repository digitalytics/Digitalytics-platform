services:
  db:
    image: postgres:16-alpine
    container_name: digitalytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: digitalytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digitalytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalytics-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/digitalytics
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
  app_data:
